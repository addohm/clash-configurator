[package]
name = "clash-configurator"
version = "0.1.0"
description = "Edit a Clash config safely: config in, guided changes, config out."
license = "MIT"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Only for the native Save dialog (src/main.rs save_file); the page gets no
# dialog or file permissions of its own.
tauri-plugin-dialog = "2"
# The update check and signed install (PLAN.md Q20), used from Rust only
# (update_check, update_install); its TLS is rustls with ring, like ours.
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
# Fetches subscription URLs safely (../fetcher, tested on its own).
cc-fetcher = { path = "../fetcher" }
# Send to phone: offers files on the local Wi-Fi for a few minutes (../sharer).
cc-sharer = { path = "../sharer" }

[profile.release]
# A smaller app: one codegen unit, link-time optimisation, no unwinding tables.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
