# Made up. Indented the way some providers write it: four spaces in some
# sections, two in others. Output must keep each section as it was.
mixed-port: 7890
mode: rule
dns:
    enable: true
    enhanced-mode: fake-ip
    nameserver:
        - https://doh.pub/dns-query
        - 223.5.5.5

# Servers
proxies:
  - name: "Server A"
    type: trojan
    server: a.example.com
    port: 443
    password: fake-password-41
  - name: "Server B"
    type: ss
    server: 192.0.2.42
    port: 8388
    cipher: aes-256-gcm
    password: fake-password-42
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Server A
      - Server B
# Rules, checked from the top
rules:
    - 'DOMAIN-SUFFIX,example.org,DIRECT'
    - 'GEOIP,CN,DIRECT,no-resolve'
    - 'MATCH,Proxy'
